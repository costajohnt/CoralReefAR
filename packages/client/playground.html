<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b1d2a" />
  <title>Coral Reef — Playground</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <style>
    body { margin: 0; background: #02111d; overflow: hidden; }
    #gl { display: block; width: 100vw; height: 100vh; }
    #mode-badge {
      position: fixed; top: 12px; left: 12px; padding: 4px 8px;
      font: 500 11px/1 system-ui, sans-serif; color: #9ab;
      background: rgba(0,0,0,0.35); border-radius: 3px;
      pointer-events: none;
    }
    /* Gallery (screen mode) overlay: sized for a wall display, readable from a distance. */
    #gallery { position: fixed; inset: auto 0 0 0; z-index: 6; padding: clamp(12px, 2.5vw, 40px);
      display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem;
      pointer-events: none; font-family: system-ui, sans-serif; color: #eef; }
    #gallery[hidden] { display: none; }
    #galleryCount { margin: 0; font-size: clamp(1.1rem, 2.6vw, 2.6rem); font-weight: 650;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
    #galleryNews { margin: 0.3em 0 0; font-size: clamp(0.9rem, 1.6vw, 1.5rem); color: #ffe58a;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
    #galleryNews:empty { display: none; }
    #galleryQr { margin: 0; text-align: center; background: rgba(2,17,29,0.7);
      border-radius: 12px; padding: clamp(8px, 1vw, 16px); }
    #galleryQrCode svg { display: block; width: clamp(110px, 15vw, 240px); height: auto; border-radius: 6px; }
    #galleryQr figcaption { margin-top: 0.5em; font-size: clamp(0.8rem, 1.3vw, 1.2rem); line-height: 1.3; }
    #galleryQrUrl { color: #9ab; font-size: 0.85em; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="mode-badge"></div>
  <aside id="gallery" hidden aria-label="Reef gallery">
    <div>
      <p id="galleryCount"></p>
      <p id="galleryNews" role="status" aria-live="polite"></p>
    </div>
    <figure id="galleryQr">
      <div id="galleryQrCode"></div>
      <figcaption>Scan to plant a coral<br /><span id="galleryQrUrl"></span></figcaption>
    </figure>
  </aside>
  <div id="picker" class="hidden" role="region" aria-label="Plant a polyp">
    <div class="picker-row" role="group" aria-label="Species">
      <button type="button" data-species="branching">Branching</button>
      <button type="button" data-species="bulbous">Bulbous</button>
      <button type="button" data-species="fan">Fan</button>
      <button type="button" data-species="tube">Tube</button>
      <button type="button" data-species="encrusting">Encrusting</button>
    </div>
    <div id="colors" class="picker-row" role="group" aria-label="Color"></div>
    <div class="picker-actions">
      <button id="rerollBtn" type="button" disabled aria-label="Regenerate shape">Reroll shape</button>
      <button id="cancelBtn" type="button" disabled aria-label="Cancel placement">Cancel</button>
    </div>
    <button id="growBtn" type="button" disabled>Grow it</button>
    <button id="undoBtn" type="button" hidden aria-label="Undo your last polyp">Undo</button>
    <button id="exportBtn" type="button" aria-label="Download the reef as a 3D model (GLB file)">Download 3D model</button>
    <p id="hint" aria-live="polite">Click the pedestal to place your polyp.</p>
    <p id="mineNote" role="status" aria-live="polite"></p>
  </div>
  <script type="module" src="/src/playground.ts"></script>
</body>
</html>
