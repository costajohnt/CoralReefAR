<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reef timelapse</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; height: 100%; background: #02111d; color: #eef; font-family: system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 0.8rem 1.2rem; border-bottom: 1px solid #123; display: flex; justify-content: space-between; align-items: baseline; }
    header h1 { font-size: 1.1rem; margin: 0; }
    header .meta { color: #9ab; font-size: 0.85rem; }
    canvas#gl { width: 100%; height: 100%; display: block; }
    footer { padding: 0.8rem 1.2rem; border-top: 1px solid #123; display: grid; gap: 0.5rem; grid-template-columns: auto 1fr auto; align-items: center; }
    footer button { background: #1b3a54; color: #eef; border: 0; border-radius: 4px; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem; }
    footer input[type=range] { width: 100%; }
    footer .time { font-variant-numeric: tabular-nums; color: #9ab; font-size: 0.85rem; }
    .video { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; font-size: 0.85rem; color: #9ab; }
    .video select { background: #0b2235; color: #eef; border: 1px solid #1b3a54; border-radius: 4px; padding: 0.25rem; }
    .video button:disabled, .video select:disabled, footer button:disabled { opacity: 0.5; cursor: default; }
    #videoStatus { margin: 0; flex: 1 1 12rem; }
  </style>
</head>
<body>
  <header>
    <h1>Reef timelapse</h1>
    <span class="meta" id=meta>loading…</span>
  </header>
  <canvas id=gl></canvas>
  <footer>
    <button id=playBtn>Play</button>
    <input id=scrub type=range min=0 max=0 value=0 step=1 />
    <span class="time" id=time>—</span>
    <div class="video" role="group" aria-label="Video export">
      <label for=videoDuration>Length</label>
      <select id=videoDuration>
        <option value="10">10 s</option>
        <option value="20" selected>20 s</option>
        <option value="30">30 s</option>
      </select>
      <label for=videoFps>Frame rate</label>
      <select id=videoFps>
        <option value="24">24 fps</option>
        <option value="30" selected>30 fps</option>
      </select>
      <button id=recordBtn type=button>Record video</button>
      <p id=videoStatus role=status aria-live=polite></p>
    </div>
  </footer>
  <script type="module" src="/src/timelapse.ts"></script>
</body>
</html>
